services:
  - type: web
    name: velvethug-storefront-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: velvethug-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: true
      - key: ADMIN_INITIAL_PASSWORD
        generateValue: true
      - key: ADMIN_INITIAL_2FA_SECRET
        value: "8942"

databases:
  - name: velvethug-postgres
    plan: free
    databaseName: velvethug
    user: velvethug_user
